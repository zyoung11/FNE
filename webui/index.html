<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FNE</title>
<link rel="stylesheet" href="app.css">
</head>
<body data-mode="{{MODE}}">

<div id="viewLogin" class="view{{INIT_LOGIN}}">
  <div class="center-screen">
    <div class="qr-frame"><img id="qrImage" alt=""></div>
  </div>
</div>

<div id="viewSearch" class="view{{INIT_SEARCH}}">
  <div class="topbar">
    <button class="cell" id="backBtn" style="display:none" onclick="goBack()">← 返回</button>
    <div class="search-form">
      <input id="keyword" placeholder="歌名 / 歌手 / 专辑名 / 网易云链接 / ID">
    </div>
    <div class="suggest" id="suggestBox" style="display:none">
      <div class="suggest-panel" id="suggestPanel"></div>
    </div>
    <button class="cell" onclick="doSearch()">搜索</button>
    <button class="cell" id="tabSong" onclick="switchTab('song')">单曲</button>
    <button class="cell" id="tabAlbum" onclick="switchTab('album')">专辑</button>
    <button class="cell" id="tabArtist" onclick="switchTab('artist')">歌手</button>
    <button class="cell" id="tabPlaylists" onclick="loadPlaylists()">歌单</button>
    <button class="cell accent" id="authCell" onclick="authClick()">未登录</button>
  </div>
  <div class="wrap">
    <div class="rowlist" id="results"></div>
  </div>
  <div class="toolbar">
    <div class="info clickable" id="selInfo" onclick="openCart()">未选择</div>
    <button class="cell" id="btnAll" onclick="toggleAll()">全选</button>
    <button class="act" id="btnToQuality" disabled onclick="goQuality()">选择音质</button>
    <button class="act primary" id="btnMaxQuality" disabled onclick="skipQuality()">默认最高音质</button>
  </div>
</div>

<div id="viewPlaylists" class="view{{INIT_LISTS}}">
  <div class="topbar">
    <button class="cell" id="plBackBtn" onclick="showView('viewSearch')">← 返回</button>
    <div class="search-form" style="pointer-events:none"><input value="我的歌单" readonly></div>
  </div>
  <div class="wrap">
    <div class="rowlist" id="playlistList"></div>
    <div class="empty" id="playlistEmpty" style="display:none"></div>
  </div>
  <div class="toolbar">
    <div class="info" id="plInfo"></div>
  </div>
</div>

<div id="viewPlaylistDetail" class="view">
  <div class="topbar">
    <button class="cell" onclick="loadPlaylists()">← 返回</button>
    <div class="search-form" style="pointer-events:none"><input id="plTitle" value="" readonly></div>
  </div>
  <div class="wrap">
    <div class="rowlist" id="plTracks"></div>
    <div class="empty" id="plEmpty" style="display:none"></div>
  </div>
  <div class="toolbar">
    <div class="info clickable" id="plSelInfo" onclick="openCart()">未选择</div>
    <button class="cell" id="plBtnAll" onclick="toggleAllPlTracks()">全选</button>
    <button class="act primary" id="plMainBtn" onclick="playlistMainAction()">选择音质</button>
  </div>
</div>

<div id="viewCart" class="view">
  <div class="topbar">
    <button class="cell" onclick="goBack()">← 返回</button>
    <div class="search-form" style="pointer-events:none"><input value="已选歌曲" readonly></div>
    <button class="cell" onclick="clearCart()">清空</button>
  </div>
  <div class="wrap">
    <div class="rowlist" id="cartList"></div>
  </div>
  <div class="toolbar">
    <div class="info" id="cartInfo"></div>
    <button class="act primary" id="cartActionBtn" onclick="playlistMainAction()">选择音质</button>
  </div>
</div>

<div id="viewQuality" class="view">
  <div class="topbar">
    <button class="cell" onclick="showView(qualityReturn)">← 返回</button>
    <div class="search-form" style="pointer-events:none"><input value="选择音质" readonly></div>
  </div>
  <div class="wrap">
    <div class="q-row"><div class="main"><div class="name">统一音质</div>
      <div class="sub">各曲目自动取所选档位内的最优可用档</div></div>
      <select id="qUnified" onchange="applyUnified()"></select></div>
    <div class="rowlist" id="qualityList"></div>
    <div class="empty" id="qualityEmpty" style="display:none">检测中…</div>
  </div>
  <div class="toolbar">
    <div class="info" id="qInfo"></div>
    <button class="act primary" onclick="goFolder()">选择位置</button>
  </div>
</div>

<div id="viewFolder" class="view">
  <div class="topbar">
    <button class="cell" onclick="showView(folderReturn)">← 返回</button>
    <div class="search-form" style="pointer-events:none"><input value="下载位置" readonly></div>
  </div>
  <div class="wrap">
    <div class="path-form">
      <input id="folderInput" placeholder="输入或粘贴保存文件夹路径">
      <button id="browseBtn" onclick="pickFolder()" style="display:none">浏览</button>
    </div>
  </div>
  <div class="toolbar">
    <div class="info" id="folderInfo"></div>
    <button class="act primary" onclick="startDownload()">开始下载</button>
  </div>
</div>

<div id="viewProgress" class="view">
  <div class="topbar">
    <div class="search-form" style="pointer-events:none"><input value="下载" readonly></div>
  </div>
  <div class="wrap">
    <div class="bar"><i id="jobBar" style="width:0%"></i></div>
    <div class="rowlist" id="jobList"></div>
  </div>
  <div class="toolbar">
    <div class="info" id="jobInfo"></div>
    <button class="act" id="jobBackBtn" onclick="backToSearch()">返回搜索</button>
  </div>
</div>

<div class="hintbar" id="hintbar"><span id="hintText"></span><div class="hint-actions" id="hintActions"><button class="cell" onclick="startLogin()">刷新</button><button class="cell accent" onclick="skipLogin()" data-tip="跳过登录将以游客身份使用，可用音质受限，通常只有标准音质">跳过</button></div></div>

<div class="modal-overlay" id="logoutModal" style="display:none" onclick="if(event.target===this)closeLogoutModal()">
  <div class="modal">
    <div class="label">退出登录</div>
    <div class="modal-text">退出后需要重新扫码登录</div>
    <div class="modal-actions">
      <button class="act" onclick="closeLogoutModal()">取消</button>
      <button class="act primary" onclick="confirmLogout()">退出登录</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script src="search.js"></script>
<script src="playlist.js"></script>
<script src="flow.js"></script>
<script src="scrollbar.js"></script>
</body>
</html>
