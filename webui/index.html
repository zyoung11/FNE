<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>下载</title>
<style>
:root {
  --page: #161513;
  --bg: #161513;
  --surface-1: #201e1c;
  --surface-2: #2a2724;
  --line: rgba(244, 240, 233, 0.11);
  --line-strong: rgba(244, 240, 233, 0.24);
  --text: rgba(248, 245, 239, 0.97);
  --text-2: rgba(248, 245, 239, 0.72);
  --text-3: rgba(248, 245, 239, 0.52);
  --text-4: rgba(248, 245, 239, 0.38);
  --accent: #ff5c00;
  --accent-soft: rgba(255, 92, 0, 0.13);
  --accent-line: rgba(255, 92, 0, 0.50);
  --btn-bg: #2b2926;
  --sb-track: #0d0c0a;
  --sb-thumb: #4a463f;
  --sb-thumb-hi: #6a635a;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", "Noto Sans Mono CJK SC", monospace;
  --fs-label: 11px;
  --fs-small: 13px;
  --fs-base: 13px;
  --fs-h2: 16px;
  --t-state: 0.12s;
  --ease: cubic-bezier(0.2, 0, 0, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--page); }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: var(--fs-base);
  line-height: 1.62;
  letter-spacing: -0.01em;
  font-feature-settings: "tnum" 1;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
::-webkit-scrollbar { width: 11px; height: 11px; background: var(--sb-track); }
::-webkit-scrollbar-thumb { background: var(--sb-thumb); border: 1px solid var(--sb-thumb-hi); }
::-webkit-scrollbar-thumb:hover { background: var(--sb-thumb-hi); }
::selection { background: var(--accent); color: #000; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }

.label {
  font-family: var(--mono);
  font-size: var(--fs-label);
  font-weight: 400;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-3);
}

.view { display: none; }
.view.active { display: block; }

.center-screen {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 22px;
}
.qr-frame {
  background: #fff;
  padding: 10px;
  line-height: 0;
  border: 1px solid var(--line-strong);
}
.qr-frame:has(img:not([src])) { display: none; }
.qr-frame img { width: 220px; height: 220px; display: block; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: stretch;
  height: 52px;
  background: var(--page);
  border-bottom: 2px solid var(--line);
}
.topbar .search-form { flex: 1; display: flex; align-items: center; border-right: 1px solid var(--line); position: relative; }
.topbar input {
  width: 100%;
  height: 100%;
  padding: 0 20px;
  border: none;
  border-radius: 0;
  background: transparent;
  font-family: var(--mono);
  font-size: var(--fs-small);
  color: var(--text);
  outline: none;
}
.topbar input::placeholder { color: var(--text-3); }
.topbar .search-form:focus-within { background: var(--surface-1); box-shadow: inset 0 -2px 0 var(--accent); }
.topbar .search-form:has(input:placeholder-shown):not(:focus-within) {
  animation: search-hint 2.4s var(--ease) infinite;
}
@keyframes search-hint {
  0%, 100% { box-shadow: inset 0 -2px 0 rgba(255, 92, 0, 0.12); }
  50% { box-shadow: inset 0 -2px 0 rgba(255, 92, 0, 0.6); }
}
.topbar .cell {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 16px;
  border: none;
  border-right: 1px solid var(--line);
  background: transparent;
  color: var(--text-3);
  font-family: var(--mono);
  font-size: var(--fs-label);
  letter-spacing: 0.12em;
  cursor: pointer;
  white-space: nowrap;
}
.topbar .cell:last-child { border-right: none; }
.topbar .cell:hover { color: var(--text); background: var(--surface-1); }
.topbar .cell.accent { color: var(--accent); }

.wrap { max-width: 900px; margin: 0 auto; padding: 28px 20px 170px; }
.step-head {
  display: flex;
  align-items: baseline;
  gap: 14px;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--line);
  margin-bottom: 0;
}
.step-head .back {
  margin-left: auto;
  background: none;
  border: none;
  color: var(--text-3);
  font-family: var(--mono);
  font-size: var(--fs-label);
  letter-spacing: 0.12em;
  cursor: pointer;
}
.step-head .back:hover { color: var(--text); }

.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tab {
  padding: 10px 18px;
  border: none;
  background: none;
  color: var(--text-3);
  font-family: var(--mono);
  font-size: var(--fs-label);
  letter-spacing: 0.12em;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.rowlist { border-bottom: 1px solid var(--line); }
.row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  transition: background var(--t-state) var(--ease);
}
.row:last-child { border-bottom: none; }
.row:hover { background: var(--surface-1); }
.row.selected { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
.row img { width: 46px; height: 46px; object-fit: cover; background: var(--surface-2); flex: none; }
.row .main { flex: 1; min-width: 0; }
.row .name { font-size: var(--fs-base); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sub {
  font-family: var(--mono);
  font-size: var(--fs-label);
  color: var(--text-3);
  letter-spacing: 0.04em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.row .dur { font-family: var(--mono); font-size: var(--fs-label); color: var(--text-3); }
.row.disabled { opacity: 0.45; cursor: not-allowed; }

.empty { padding: 64px 0; text-align: center; color: var(--text-4); font-family: var(--mono); font-size: var(--fs-label); letter-spacing: 0.08em; }
.center-screen { padding-bottom: 96px; }

.hintbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 20px;
  background: var(--page);
  border-top: 2px solid var(--line);
  color: var(--text-4);
  font-family: var(--mono);
  font-size: var(--fs-label);
  letter-spacing: 0.12em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  z-index: 41;
}

.toolbar {
  position: fixed;
  left: 0; right: 0; bottom: 36px;
  display: flex;
  align-items: stretch;
  height: 56px;
  background: var(--page);
  border-top: 2px solid var(--line);
  z-index: 40;
}
.toolbar .info {
  flex: 1;
  display: flex;
  align-items: center;
  padding: 0 20px;
  border-right: 1px solid var(--line);
  color: var(--text-4);
  font-family: var(--mono);
  font-size: var(--fs-label);
  letter-spacing: 0.12em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
button.act {
  padding: 0 32px;
  border: none;
  border-right: 1px solid var(--line);
  background: var(--btn-bg);
  color: var(--text);
  font-family: var(--mono);
  font-size: var(--fs-small);
  letter-spacing: 0.12em;
  cursor: pointer;
  transition: background var(--t-state) var(--ease);
}
button.act:hover { background: var(--surface-2); }
button.act.primary { background: var(--accent); color: #000; font-weight: 700; }
button.act.primary:hover { background: #ff7326; }
button.act:disabled { opacity: 0.4; cursor: not-allowed; }

.path-form { display: flex; align-items: stretch; border: 1px solid var(--line-strong); margin-top: 8px; }
.path-form input {
  flex: 1;
  padding: 14px 16px;
  border: none;
  background: transparent;
  color: var(--text);
  font-family: var(--mono);
  font-size: var(--fs-small);
  outline: none;
}
.path-form input:focus { background: var(--surface-1); box-shadow: inset 0 -2px 0 var(--accent); }
.path-form button {
  padding: 0 22px;
  border: none;
  border-left: 1px solid var(--line);
  background: var(--btn-bg);
  color: var(--text-2);
  font-family: var(--mono);
  font-size: var(--fs-label);
  letter-spacing: 0.12em;
  cursor: pointer;
}
.path-form button:hover { background: var(--surface-2); color: var(--text); }

.q-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px;
  border-bottom: 1px solid var(--line);
}
.q-row .main { flex: 1; min-width: 0; }
.q-row select {
  min-width: 180px;
  padding: 9px 12px;
  border: 1px solid var(--line-strong);
  border-radius: 0;
  background: var(--surface-1);
  color: var(--text);
  font-family: var(--mono);
  font-size: var(--fs-small);
  outline: none;
  cursor: pointer;
}
.q-row select:focus { border-color: var(--accent); }

.bar { height: 2px; background: var(--surface-2); margin: 18px 0; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width 0.3s var(--ease); }
.j-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
  font-family: var(--mono);
  font-size: var(--fs-small);
}
.j-row .st { width: 20px; flex: none; color: var(--text-3); }
.j-row.done .st { color: var(--accent); }
.j-row.failed .st { color: var(--text-3); }
.j-row .main { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.j-row .det { color: var(--text-4); font-size: var(--fs-label); }
</style>
</head>
<body>

<div id="viewLogin" class="view{{INIT_LOGIN}}">
  <div class="center-screen">
    <div class="qr-frame"><img id="qrImage" alt=""></div>
  </div>
</div>

<div id="viewSearch" class="view{{INIT_SEARCH}}">
  <div class="topbar">
    <div class="search-form">
      <input id="keyword" placeholder="歌名 / 专辑名 / 网易云链接 / ID" onkeydown="if(event.key==='Enter')doSearch()">
    </div>
    <button class="cell" onclick="doSearch()">搜索</button>
    <button class="cell" id="tabSong" onclick="switchTab('song')">单曲</button>
    <button class="cell" id="tabAlbum" onclick="switchTab('album')">专辑</button>
    <button class="cell accent" id="authCell" onclick="showView('viewLogin')">未登录</button>
  </div>
  <div class="wrap">
    <div class="step-head" id="searchStep" style="display:none">
      <span class="label">搜索</span>
    </div>
    <div class="rowlist" id="results"></div>
  </div>
  <div class="toolbar">
    <div class="info" id="selInfo">未选择</div>
    <button class="act primary" id="btnToQuality" disabled onclick="goQuality()">选择音质</button>
  </div>
</div>

<div id="viewQuality" class="view">
  <div class="topbar">
    <button class="cell" onclick="showView('viewSearch')">← 返回</button>
    <div class="search-form" style="pointer-events:none"><input value="选择音质" readonly></div>
  </div>
  <div class="wrap">
    <div class="step-head"><span class="label">音质</span></div>
    <div class="rowlist" id="qualityList"></div>
    <div class="empty" id="qualityEmpty" style="display:none">检测中…</div>
  </div>
  <div class="toolbar">
    <div class="info" id="qInfo"></div>
    <button class="act primary" onclick="goFolder()">选择位置</button>
  </div>
</div>

<div id="viewFolder" class="view">
  <div class="topbar">
    <button class="cell" onclick="showView('viewQuality')">← 返回</button>
    <div class="search-form" style="pointer-events:none"><input value="下载位置" readonly></div>
  </div>
  <div class="wrap">
    <div class="step-head"><span class="label">位置</span></div>
    <div class="path-form">
      <input id="folderInput" placeholder="输入或粘贴保存文件夹路径">
      <button id="browseBtn" onclick="pickFolder()" style="display:none">浏览</button>
    </div>
  </div>
  <div class="toolbar">
    <div class="info" id="folderInfo"></div>
    <button class="act primary" onclick="startDownload()">开始下载</button>
  </div>
</div>

<div id="viewProgress" class="view">
  <div class="topbar">
    <div class="search-form" style="pointer-events:none"><input value="下载" readonly></div>
  </div>
  <div class="wrap">
    <div class="step-head"><span class="label">下载</span></div>
    <div class="bar"><i id="jobBar" style="width:0%"></i></div>
    <div class="rowlist" id="jobList"></div>
  </div>
  <div class="toolbar">
    <div class="info" id="jobInfo"></div>
    <button class="act" onclick="backToSearch()">返回搜索</button>
  </div>
</div>

<div class="hintbar" id="hintbar"></div>

<script>
const LEVELS = [
  ['standard', '标准 128k'],
  ['higher', '较高 192k'],
  ['exhigh', '极高 320k'],
  ['lossless', '无损 FLAC'],
  ['hires', 'Hi-Res'],
  ['jyeffect', '高清环绕声'],
  ['sky', '沉浸环绕声'],
  ['dolby', '杜比全景声'],
  ['jymaster', '超清母带']
];
const LEVEL_NAME = Object.fromEntries(LEVELS);
const HINTS = {
  viewLogin: '使用网易云音乐 APP 扫码登录 · r 刷新 · s 跳过',
  viewSearch: '点击行选择 · 输入歌名 / 专辑名 / 链接 / ID 搜索',
  viewQuality: '每首歌按可用最高档位选择 · Enter 确认',
  viewFolder: '输入或粘贴保存文件夹路径 · Enter 确认',
  viewProgress: '下载完成后自动返回搜索'
};

let status = {};
let searchType = 'song';
let results = [];
let albumTracks = [];
let selected = new Map();
let quality = new Map();
let loginTimer = null;
let jobTimer = null;

async function fetchJSON(url, options) {
  const resp = await fetch(url, options);
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.error || ('HTTP ' + resp.status));
  return data;
}

function esc(text) {
  const d = document.createElement('div');
  d.textContent = text == null ? '' : text;
  return d.innerHTML;
}

function fmtDur(ms) {
  const s = Math.round((ms || 0) / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function showView(id) {
  document.querySelectorAll('.view').forEach((v) => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('hintbar').textContent = HINTS[id] || '';
  window.scrollTo(0, 0);
  if (id === 'viewSearch') {
    document.getElementById('keyword').focus();
  }
}

async function refreshStatus() {
  try {
    status = await fetchJSON('/api/status');
    const cell = document.getElementById('authCell');
    if (status.loggedIn) {
      cell.textContent = status.nickname || '已登录';
      cell.classList.remove('accent');
    } else {
      cell.textContent = '未登录';
      cell.classList.add('accent');
    }
    if (status.defaultFolder) {
      document.getElementById('folderInput').value = status.defaultFolder;
      document.getElementById('folderInfo').textContent = status.defaultFolder;
    }
    document.getElementById('browseBtn').style.display = status.platform === 'windows' ? '' : 'none';
  } catch (e) {
    document.getElementById('authCell').textContent = '状态异常';
  }
}

async function startLogin() {
  try {
    const data = await fetchJSON('/api/login/qr', { method: 'POST' });
    document.getElementById('qrImage').src = '/api/qr.png?key=' + encodeURIComponent(data.key);
    setLoginState('等待扫码');
    if (loginTimer) clearInterval(loginTimer);
    loginTimer = setInterval(() => checkLogin(data.key), 2000);
  } catch (e) {
    setLoginState('二维码获取失败 ' + e.message);
  }
}

function setLoginState(state) {
  if (!document.getElementById('viewLogin').classList.contains('active')) return;
  document.getElementById('hintbar').textContent = state ? (HINTS.viewLogin + ' · ' + state) : HINTS.viewLogin;
}

document.addEventListener('keydown', (e) => {
  const active = document.querySelector('.view.active').id;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (active === 'viewLogin') {
    if (e.key === 'r') { e.preventDefault(); startLogin(); }
    if (e.key === 's') { e.preventDefault(); skipLogin(); }
    return;
  }
  if (e.key === 'Enter') {
    if (active === 'viewQuality') { e.preventDefault(); goFolder(); }
    else if (active === 'viewFolder') { e.preventDefault(); startDownload(); }
  }
});

async function checkLogin(key) {
  try {
    const data = await fetchJSON('/api/login/check?key=' + encodeURIComponent(key));
    if (data.code === 803) {
      const saved = data.saved !== false;
      setLoginState(saved ? ('登录成功 · 已保存 ' + (status.cookiePath || '')) : '登录成功 · cookie 保存失败');
      clearInterval(loginTimer);
      loginTimer = null;
      await refreshStatus();
      showView('viewSearch');
    } else if (data.code === 802) {
      setLoginState('已扫码 · 请在手机上确认');
    } else if (data.code === 800) {
      setLoginState('二维码已过期 · 按 r 刷新');
      clearInterval(loginTimer);
      loginTimer = null;
    }
  } catch (e) {
    setLoginState('检查失败 ' + e.message);
  }
}

function skipLogin() {
  if (loginTimer) { clearInterval(loginTimer); loginTimer = null; }
  showView('viewSearch');
}

function switchTab(type) {
  searchType = type;
  document.getElementById('tabSong').classList.toggle('accent', type === 'song');
  document.getElementById('tabAlbum').classList.toggle('accent', type === 'album');
}

function parseInput(text) {
  const m = text.match(/music\.163\.com\/.*?(?:song|album|playlist)\?id=(\d+)/);
  if (m) {
    const kind = text.includes('album') ? 'album' : (text.includes('playlist') ? 'playlist' : 'song');
    return { kind, id: m[1] };
  }
  if (/^\d+$/.test(text.trim())) return { kind: searchType, id: text.trim() };
  return null;
}

async function doSearch() {
  const text = document.getElementById('keyword').value.trim();
  if (!text) return;
  const direct = parseInput(text);
  document.getElementById('results').innerHTML = '';
  document.getElementById('hintbar').textContent = HINTS.viewSearch;
  results = [];
  document.getElementById('searchStep').style.display = 'none';
  selected.clear();
  updateSel();
  try {
    if (direct && direct.kind === 'album') {
      await loadAlbum(direct.id);
      return;
    }
    const kw = direct ? direct.id : encodeURIComponent(text);
    const data = await fetchJSON('/api/search?type=' + searchType + '&kw=' + kw + '&limit=30');
    if (data.type === 'album') {
      results = (data.albums || []).map((a) => ({
        id: a.id, name: a.name, artists: a.artist, album: '', coverUrl: a.coverUrl,
        duration: 0, trackNum: a.trackNum, isAlbum: true
      }));
    } else {
      results = data.songs || [];
    }
    if (!results.length) {
      document.getElementById('hintbar').textContent = '没有结果 · 换个关键词，或直接粘贴歌曲链接';
    }
    renderResults();
  } catch (e) {
    document.getElementById('hintbar').textContent = '搜索失败 ' + e.message;
  }
}

function renderResults() {
  const box = document.getElementById('results');
  document.getElementById('searchStep').style.display = results.length ? 'flex' : 'none';
  box.innerHTML = results.map((s, i) => `
    <div class="row ${selected.has(s.id) ? 'selected' : ''}" onclick="toggleResult(${i})">
      <img src="${esc(s.coverUrl || '')}" loading="lazy" alt="">
      <div class="main">
        <div class="name">${esc(s.name)}</div>
        <div class="sub">${esc(s.artists)}${s.isAlbum ? ' · ' + s.trackNum + ' 首' : ''}</div>
      </div>
      <div class="dur">${s.isAlbum ? 'ALBUM' : fmtDur(s.duration)}</div>
    </div>`).join('');
}

async function toggleResult(i) {
  const s = results[i];
  if (s.isAlbum) {
    await loadAlbum(s.id);
    return;
  }
  if (selected.has(s.id)) selected.delete(s.id); else selected.set(s.id, s);
  renderResults();
  updateSel();
}

async function loadAlbum(id) {
  const data = await fetchJSON('/api/album?id=' + id);
  albumTracks = data.songs || [];
  selected.clear();
  albumTracks.forEach((s) => selected.set(s.id, s));
  results = albumTracks;
  renderResults();
  updateSel();
}

function updateSel() {
  const n = selected.size;
  const total = results.length ? results.length + ' 条 · ' : '';
  document.getElementById('selInfo').textContent = n ? (total + '已选 ' + n + ' 首') : (total + '未选择');
  document.getElementById('btnToQuality').disabled = n === 0;
}

async function goQuality() {
  if (!selected.size) return;
  showView('viewQuality');
  const list = document.getElementById('qualityList');
  const empty = document.getElementById('qualityEmpty');
  empty.style.display = '';
  empty.textContent = '检测可用音质…';
  list.innerHTML = '';
  quality.clear();
  try {
    const songs = Array.from(selected.values());
    const data = await fetchJSON('/api/check', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ songs })
    });
    empty.style.display = 'none';
    list.innerHTML = songs.map((s, i) => {
      const r = (data.results || []).find((x) => x.id === s.id) || {};
      if (!r.ok) {
        return `<div class="q-row"><div class="main"><div class="name">${esc(s.name)}</div>
          <div class="sub">${esc(s.artists)}</div></div><div class="label">不可下载</div></div>`;
      }
      const maxIdx = LEVELS.findIndex((l) => l[0] === r.maxLevel);
      const opts = LEVELS.slice(0, maxIdx + 1).map((l) =>
        `<option value="${l[0]}" ${l[0] === r.maxLevel ? 'selected' : ''}>${l[1]}</option>`).join('');
      quality.set(s.id, r.maxLevel);
      return `<div class="q-row"><div class="main"><div class="name">${esc(s.name)}</div>
        <div class="sub">${esc(s.artists)} · 最高 ${LEVEL_NAME[r.maxLevel] || r.maxLevel} · ${r.type}</div></div>
        <select data-id="${s.id}" onchange="quality.set(${s.id}, this.value)">${opts}</select></div>`;
    }).join('');
    document.getElementById('qInfo').textContent = selected.size + ' 首 · 各自最高档位已标注';
  } catch (e) {
    empty.style.display = '';
    empty.textContent = '音质检测失败 ' + e.message;
  }
}

function goFolder() {
  showView('viewFolder');
  document.getElementById('folderInfo').textContent = document.getElementById('folderInput').value || '未设置';
}

async function pickFolder() {
  const info = document.getElementById('folderInfo');
  info.textContent = '请在弹出的窗口中选择文件夹…';
  try {
    const data = await fetchJSON('/api/pick-folder', { method: 'POST' });
    document.getElementById('folderInput').value = data.folder;
    info.textContent = data.folder;
  } catch (e) {
    info.textContent = '选择失败 ' + e.message;
  }
}

async function startDownload() {
  const folder = document.getElementById('folderInput').value.trim();
  if (!folder) {
    document.getElementById('folderInfo').textContent = '请先填写保存路径';
    return;
  }
  const items = [];
  selected.forEach((s) => {
    if (quality.has(s.id)) items.push({ song: s, level: quality.get(s.id) });
  });
  if (!items.length) {
    document.getElementById('folderInfo').textContent = '没有可下载的歌曲';
    return;
  }
  try {
    await fetchJSON('/api/download', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ folder, items })
    });
    showView('viewProgress');
    if (jobTimer) clearInterval(jobTimer);
    jobTimer = setInterval(refreshJob, 800);
    refreshJob();
  } catch (e) {
    document.getElementById('folderInfo').textContent = '启动失败 ' + e.message;
  }
}

async function refreshJob() {
  try {
    const job = await fetchJSON('/api/job');
    if (job.state === 'idle') return;
    const total = job.items ? job.items.length : 0;
    const pct = total ? Math.round((job.done / total) * 100) : 0;
    document.getElementById('jobBar').style.width = pct + '%';
    document.getElementById('jobInfo').textContent = (job.state === 'finished' ? '完成' : '进行中 ' + pct + '%') + ' · ' + job.done + ' / ' + total + ' · ' + (job.folder || '');
    document.getElementById('jobList').innerHTML = (job.items || []).map((it) => {
      const cls = it.state === 'done' ? 'done' : (it.state === 'failed' ? 'failed' : '');
      const mark = it.state === 'done' ? '✓' : (it.state === 'failed' ? '✕' : '·');
      return `<div class="j-row ${cls}"><div class="st">${mark}</div>
        <div class="main">${esc(it.song.name)} — ${esc(it.song.artists)}</div>
        <div class="det">${esc(LEVEL_NAME[it.level] || it.level)}${it.detail ? ' · ' + esc(it.detail) : ''}</div></div>`;
    }).join('');
    if (job.state === 'finished') {
      clearInterval(jobTimer);
      jobTimer = null;
    }
  } catch (e) {
  }
}

function backToSearch() {
  if (jobTimer) { clearInterval(jobTimer); jobTimer = null; }
  selected.clear();
  quality.clear();
  updateSel();
  showView('viewSearch');
  refreshStatus();
}

refreshStatus().then(() => {
  if (status.loggedIn) {
    showView('viewSearch');
  } else {
    startLogin();
  }
});
</script>
</body>
